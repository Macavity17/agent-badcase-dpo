# Round-2 state-action DPO. Keep v1 outputs intact for comparison.
model_name_or_path: ./models/Qwen2.5-1.5B-Instruct
trust_remote_code: true

stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

dataset: agent_pref_train
eval_dataset: agent_pref_eval
dataset_dir: ./data/round2/lf_data
template: qwen
cutoff_len: 4096
max_samples: 2000
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: ./outputs/round2/dpo-adapter
logging_steps: 2
save_steps: 5
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 5
load_best_model_at_end: true
